spring:
  application:
    name: settlegraph-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:settlegraph}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

settlegraph:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-please-0123456789}
    expiration-ms: 86400000
